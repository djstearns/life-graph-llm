<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Color Grid</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --font-size-base: 13px;
            --font-color: #222;
            --muted-color: #666;
        }

        /* Apply consistent font template across the document */
        body {
            font-family: var(--font-family);
            font-size: var(--font-size-base);
            color: var(--font-color);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            margin: 16px;
        }

        .yearLabel{
            display: flex;
            align-items: center; /* center vertically in its grid cell */
            justify-content: flex-end;
            color: var(--muted-color);
            font-size: 12px;
            padding: 0 8px;
            box-sizing: border-box;
        }
        .grid {
            display: grid;
            /* first column reserved for years, then 52 week columns */
            grid-template-columns: 70px repeat(52, 1fr);
            /* make each row the height of a box + gap so year labels align vertically */
            grid-auto-rows: calc(9.17188px + 10px);
            gap: 0 10px; /* no vertical gap (included in grid-auto-rows), horizontal gap 10px */
            margin-top: 0; /* spacing handled by .gridWrapper */
            align-items: start;
        }
        #container {
            margin-left: 0px;
            margin-right: 0px;

        }

        .tooltip {
            position: relative;
            display: inline-block;
            border-bottom: 1px dotted black;
            }

        /* wrapper to place years at left and the week-grid to the right */
        .gridWrapper{
            display: grid;
            grid-template-columns: 1fr; /* single column wrapper — years live inside #gridContainer now */
            align-items: start;
            gap: 0 10px;
            margin-top: 20px;
        }

        /* (duplicate, removed) */

            .tooltip .tooltiptext {
            visibility: hidden;
            /* allow tooltip to size to content, but limit width for long comments */
            max-width: 320px;
            min-width: 160px; /* ensure date string doesn't wrap into a vertical column */
            display: inline-block;
            background-color: rgba(0,0,0,0.9);
            color: #fff;
            text-align: left;
            font-size: 13px;
            font-weight: 400;
            border-radius: 6px;
            padding: 8px 10px;
            white-space: normal; /* wrap normally instead of forcing vertical layout */
            /* word-break: break-word; */
            line-height: 1.2;

            /* ensure date line stays on one line */
            --tooltip-date-nowrap: nowrap;

            /* Position the tooltip above the box and center it */
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            }

            .tooltip .tooltiptext .tooltipDate{
                white-space: nowrap; /* keep date on one line */
                display: inline-block;
            }

            .tooltip:hover .tooltiptext {
            visibility: visible;
            }

            /* small arrow pointing down */
            .tooltip .tooltiptext::after {
                content: "";
                position: absolute;
                top: 100%;
                left: 50%;
                margin-left: -5px;
                border-width: 5px;
                border-style: solid;
                border-color: black transparent transparent transparent;
            }
   
        .box {
            background-color :rgb(120, 113, 108);
            border-bottom-color: rgb(68, 64, 60);
            border-bottom-style:solid;
            border-bottom-width: 1px;
            border-image-outset: 0;
            border-image-repeat: stretch;
            border-image-slice: 100%;
            border-image-source: none;
            border-image-width: 1;
            border-left-color:rgb(68, 64, 60);
            border-left-style: solid;
            border-left-width: 1px;
            border-right-color: rgb(68, 64, 60);
            border-right-style: solid;
            border-right-width: 1px;
            border-top-color: rgb(68, 64, 60);
            border-top-style: solid;
            border-top-width: 1px;
            color: rgb(68, 64, 60);
            cursor: pointer;
            display: block;
            height: 9.17188px;
            line-height: 24px;
            tab-size: 4;
            text-size-adjust: 100%;
            unicode-bidi: isolate;
            width: 9.17188px;
        }
        .filled {
            background-color: #4caf50; /* Color for filled */
        }
        #jsonInput {
            width: 100%;
            height: 100px;
            font-family: var(--font-family);
            font-size: var(--font-size-base);
        }
        #submitButton {
            margin-top: 10px;
            font-family: var(--font-family);
            font-size: var(--font-size-base);
        }
    </style>
</head>
<body>
    <!--<h1>Custom Grid with Comments</h1>-->
    Paste your json in the input box below and see your generated graph in HTML.
    <textarea id="jsonInput" placeholder='Enter JSON data array, e.g., {"birthdate":"1967-08-15","data":[{"date": "2024-09-17", "comment": "B"},{"date": "2024-09-16", "comment": "A"},{"date":"1987-08-15","comment":"birth"},{"range":["1987-10-01","1987-10-08"],"comment":"whaddup"}]}'></textarea>
    <button id="submitButton">Update Grid</button>
    <div id="container">
        <div class="gridWrapper">
            <div id="gridContainer" class="grid"></div>
        </div>
    </div>

    <script>
        const TOTAL_BOXES = 4680;
        const GRID_COLUMNS = 52;
        const GRID_ROWS = 90;

        // Function to create the grid
        function createGrid(jsonData) {
            const jsonDat = jsonData;
            jsonData = jsonData.data;
            const container = document.getElementById('gridContainer');
            container.innerHTML = ''; // Clear any existing content

            const bday = new Date(Date.parse(jsonDat.birthdate));
            const bday_dow = bday.getDay();
            
            console.log(jsonData.length);
            const oneDay = 24 * 60 * 60 * 1000;
            //parse jsonData for date ranges:
            for (let d = 0; d < jsonData.length; d++){
                obj = jsonData[d];
                if (obj.hasOwnProperty('range')){
                    stdte = new Date(obj['range'][0]);
                    eddte = new Date(obj['range'][1]);
                    r_dow = stdte.getDay();
                    curdte = stdte;
                    diffDays = Math.round(Math.abs((stdte - eddte) /  oneDay));
                    for(f=0; f < diffDays; f++ ){
                        console.log(curdte)
                        // three cases: bday before, bday on, bday after range day of week. also, range < 7, = 7, > 7.
                        // case 1: 
                        //if bday is on a Monday, and range start is a tuesday and length > 7, then two blocks have comment
                        if(f == 0 || f % 7 == 0 || ((r_dow < bday_dow) & (f < (diffDays -7 )) )){
                            jsonData.push({'date':curdte.toISOString().split('T')[0],'comment':jsonData[d].comment})
                        }else{
                            jsonData.push({'date':curdte.toISOString().split('T')[0],'comment':''})
                        }
                        
                        curdte.setDate(curdte.getDate()+1);
                    }
                    
                }
            }


            // Create year labels for each row (place inside grid column 1)
            const rows = Math.ceil(TOTAL_BOXES / GRID_COLUMNS);
            const birthYear = bday.getFullYear();
            for (let r = 0; r < rows; r++){
                const y = document.createElement('div');
                y.className = 'yearLabel';
                y.textContent = birthYear + r;
                // position in grid: column 1, row (r + 1)
                y.style.gridColumn = '1';
                y.style.gridRow = (r + 1).toString();
                container.appendChild(y);
            }

            // Create colored boxes for the grid
            for (let i = 0; i < TOTAL_BOXES; i++) {
                const box = document.createElement('div');
                box.className = 'box';
                box.id = `box-${i}`;

                const span = document.createElement('span')
                span.className = 'tooltiptext';


                // Calculate the date for the box
                //const date = new Date();
                const startdate = new Date(Date.parse(jsonDat.birthdate));

                // Calculate the date for the box (each box represents a week)
                const startDate = new Date(startdate);
                startdate.setDate(startDate.getDate() + (i * 7));
                boxString = startdate.toISOString().split('T')[0];
                content = '';
                testdate = startdate;
               
            
                for(j = 0; j < 7; j++){
                          //iterate days to see if this box is included in any of the ranges
                    const dateString = testdate.toISOString().split('T')[0];
                    const item = jsonData.find(item => item.date === dateString);
                    if (item) {
                        content = item.comment + content;
                    }
                    testdate.setDate(testdate.getDate() + 1);
                }
                if (content != ''){
                    box.classList.add('filled');
                    // put the comment inside the hover tooltip (date + comment)
                    span.innerHTML = `<span class="tooltipDate">${boxString}</span><br><strong>${content}</strong>`;
                } else {
                    // always wrap date in .tooltipDate so it won't wrap
                    span.innerHTML = `<span class="tooltipDate">${boxString}</span>`;
                }
                box.classList.add('tooltip');
                box.appendChild(span);
                // compute grid position: columns start at 2 (1 is years)
                const col = (i % GRID_COLUMNS) + 2; // +2 because grid columns begin at 1 and first is year
                const row = Math.floor(i / GRID_COLUMNS) + 1;
                box.style.gridColumn = col.toString();
                box.style.gridRow = row.toString();
                container.appendChild(box);
              
            }
        }

        // Function to handle form submission
        function handleFormSubmit() {
            const input = document.getElementById('jsonInput').value;
            let jsonData;

            try {
                jsonDat = JSON.parse(input);
                jsonData = jsonDat.data;
                // if (!Array.isArray(jsonData) || !jsonData.every((item => typeof item.date === 'string') || (item => typeof item.range === 'string' ) && typeof item.comment === 'string')) {
                //     throw new Error('Invalid JSON structure');
                // }
            } catch (error) {
                alert('Invalid JSON input. Please provide a valid JSON array with date and comment fields.');
                return;
            }

            createGrid(jsonDat);
        }

        // Attach event listener to the submit button
        document.getElementById('submitButton').addEventListener('click', handleFormSubmit);

        // Initial grid with default data (safe default to avoid errors)
        createGrid({ birthdate: new Date().toISOString().split('T')[0], data: [] });
    </script>
</body>
</html>
